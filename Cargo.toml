[workspace]
resolver = "3"
members = [
    "apps/CosmicDMS",
    "apps/CosmicDMS-web",
    "crates/engine",
    "crates/geom",
    "crates/io",
    "crates/kernel",
    "crates/render",
    "crates/ui-egui",
    "xtask",
]
default-members = ["apps/CosmicDMS"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tangency-labs/CosmicCAM"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
CosmicDMS-engine = { path = "crates/engine" }
CosmicDMS-geom = { path = "crates/geom" }
CosmicDMS-io = { path = "crates/io" }
CosmicDMS-kernel = { path = "crates/kernel" }
CosmicDMS-render = { path = "crates/render" }
CosmicDMS-ui-egui = { path = "crates/ui-egui" }

bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_dock = "0.21.1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = "0.4"
glam = "0.30"
i_overlay = { version = "9.1", default-features = false }
log = "0.4"
miniz_oxide = "0.8"
resvg = { version = "=0.48.1", default-features = false }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2.15"
png = "0.18"
quick-xml = "0.41"
thiserror = "2"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"] }
truck-modeling = "0.6"
truck-shapeops = "0.4"
wgpu = { version = "30", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Window"] }

[profile.release]
debug = "line-tables-only"

# The geometry kernels (drop cutters, voxel stock, collision checks) run thousands of times per
# toolpath and simulation; unoptimised they make debug runs and tests crawl.
[profile.dev.package.CosmicDMS-geom]
opt-level = 2

# Model import tessellates whole CAD files; the triangulator and readers too.
[profile.dev.package.CosmicDMS-io]
opt-level = 2

[profile.dev.package.spade]
opt-level = 2

# CAD mode's solid booleans and tessellation (the truck kernel) crawl unoptimised.
[profile.dev.package.CosmicDMS-kernel]
opt-level = 2

[profile.dev.package.truck-base]
opt-level = 2

[profile.dev.package.truck-geometry]
opt-level = 2

[profile.dev.package.truck-geotrait]
opt-level = 2

[profile.dev.package.truck-topology]
opt-level = 2

[profile.dev.package.truck-modeling]
opt-level = 2

[profile.dev.package.truck-shapeops]
opt-level = 2

[profile.dev.package.truck-meshalgo]
opt-level = 2

[profile.dev.package.truck-polymesh]
opt-level = 2

[profile.dev.package.cgmath]
opt-level = 2

[profile.dev.package.rustc-hash]
opt-level = 2
