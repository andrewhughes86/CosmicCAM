<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- CosmicCAM application icon: an asteroid in deep space, ringed by its orbit as a
       toolpath rings a part. Original artwork, MIT OR Apache-2.0. -->
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1D2D52"/>
      <stop offset="1" stop-color="#090F1F"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.7" cy="0.68" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rock" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#C9BBAC"/>
      <stop offset="0.55" stop-color="#857566"/>
      <stop offset="1" stop-color="#3E342E"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="12" y="12" width="232" height="232" rx="52"/>
    </clipPath>
  </defs>

  <!-- The tile of deep space. -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#space)"/>
  <g clip-path="url(#tile)">
    <rect x="12" y="12" width="232" height="232" fill="url(#nebula)"/>
    <g fill="#FFFFFF">
      <circle cx="58" cy="62" r="2.6"/>
      <circle cx="200" cy="54" r="2"/>
      <circle cx="214" cy="146" r="1.8"/>
      <circle cx="44" cy="170" r="1.6"/>
      <circle cx="84" cy="214" r="2.2"/>
      <circle cx="176" cy="206" r="1.4"/>
      <circle cx="120" cy="40" r="1.3"/>
      <circle cx="226" cy="98" r="1.2"/>
    </g>
    <path d="M196 182v16M188 190h16" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M60 104v10M55 109h10" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="#4C6AA3" stroke-width="4"/>

  <!-- The back of the orbit ring, behind the asteroid. -->
  <g transform="translate(128 132) rotate(-18)">
    <path d="M-96 0A96 26 0 0 1 96 0" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- The asteroid. -->
  <path d="M74 128C68 94 104 66 138 72C168 60 206 86 200 122C210 152 184 190 146 186C112 198 80 172 74 128Z"
        fill="url(#rock)" stroke="#2E2621" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#4F443C">
    <ellipse cx="112" cy="112" rx="16" ry="12"/>
    <ellipse cx="164" cy="150" rx="18" ry="13"/>
    <ellipse cx="156" cy="98" rx="9" ry="6.5"/>
    <ellipse cx="110" cy="160" rx="9" ry="6"/>
  </g>
  <g fill="none" stroke="#D9CCBE" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M98 106a16 12 0 0 1 26 -4"/>
    <path d="M148 142a18 13 0 0 1 30 -3"/>
    <path d="M149 94a9 6.5 0 0 1 13 -1"/>
  </g>
  <!-- The front of the orbit ring, over the asteroid: the toolpath. -->
  <g transform="translate(128 132) rotate(-18)">
    <path d="M-96 0A96 26 0 0 0 96 0" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
