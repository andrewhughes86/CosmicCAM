<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- CosmicDMS job file (.cosmic): an asteroid riding on a page of deep space, with a
       part and its contour toolpath below. Original artwork, MIT OR Apache-2.0. -->
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1D2D52"/>
      <stop offset="1" stop-color="#090F1F"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.72" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rock" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#C9BBAC"/>
      <stop offset="0.55" stop-color="#857566"/>
      <stop offset="1" stop-color="#3E342E"/>
    </radialGradient>
    <clipPath id="page">
      <path d="M60 40H162L206 84V224a8 8 0 0 1-8 8H60a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8Z"/>
    </clipPath>
  </defs>

  <!-- The page. -->
  <path d="M60 40H162L206 84V224a8 8 0 0 1-8 8H60a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8Z" fill="url(#space)"/>
  <g clip-path="url(#page)">
    <rect x="52" y="40" width="154" height="192" fill="url(#nebula)"/>
    <g fill="#FFFFFF">
      <circle cx="176" cy="104" r="2.6"/>
      <circle cx="74" cy="128" r="2"/>
      <circle cx="190" cy="146" r="1.6"/>
      <circle cx="148" cy="118" r="1.4"/>
      <circle cx="70" cy="200" r="1.8"/>
      <circle cx="122" cy="132" r="1.2"/>
      <circle cx="186" cy="212" r="2.2"/>
      <circle cx="96" cy="146" r="1.3"/>
    </g>
    <path d="M176 96v16M168 104h16" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <!-- A part and the contour toolpath around it. -->
    <rect x="96" y="172" width="64" height="30" rx="5" fill="#94A3B8"/>
    <rect x="96" y="172" width="64" height="9" rx="4" fill="#CBD5E1"/>
    <rect x="82" y="159" width="92" height="56" rx="14" fill="none" stroke="#22D3EE" stroke-width="5"/>
    <path d="M70 226 L84 212" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Folded corner. -->
  <path d="M162 40V76a8 8 0 0 0 8 8H206Z" fill="#3A5287"/>
  <path d="M60 40H162L206 84V224a8 8 0 0 1-8 8H60a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8Z" fill="none" stroke="#4C6AA3" stroke-width="3" stroke-linejoin="round"/>

  <!-- The asteroid on top, with the back of its orbit ring behind it. -->
  <g transform="translate(104 58) rotate(-16)">
    <path d="M-68 0A68 17 0 0 1 68 0" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>
  <path d="M60 56C56 34 80 16 102 20C122 12 148 28 146 52C154 72 136 98 110 96C88 104 64 86 60 56Z"
        fill="url(#rock)" stroke="#2E2621" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#4F443C">
    <ellipse cx="88" cy="46" rx="11" ry="8"/>
    <ellipse cx="124" cy="70" rx="13" ry="9"/>
    <ellipse cx="117" cy="36" rx="6" ry="4.5"/>
    <ellipse cx="86" cy="78" rx="6" ry="4"/>
  </g>
  <g fill="none" stroke="#D9CCBE" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M78 42a11 8 0 0 1 18 -3"/>
    <path d="M112 64a13 9 0 0 1 22 -2"/>
    <path d="M112 33a6 4.5 0 0 1 9 -1"/>
  </g>
  <g transform="translate(104 58) rotate(-16)">
    <path d="M-68 0A68 17 0 0 0 68 0" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
