[package]
name = "CosmicCAM-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
CosmicCAM-engine = { workspace = true }
CosmicCAM-geom = { workspace = true }
CosmicCAM-render = { workspace = true }
bytemuck = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true, features = ["wgsl"] }
png = { workspace = true }
resvg = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["accesskit", "wayland", "x11"] }
getrandom = { workspace = true }
rfd = { workspace = true }

# The browser build: WebGPU where available, WebGL 2 otherwise.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wgpu = { workspace = true, features = ["webgl", "webgpu"] }
