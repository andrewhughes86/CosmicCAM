[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmiccam"
version = "0.1.0"
description = "Python API for the CosmicCAM CAM application"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["cosmiccam"]

[tool.setuptools.package-data]
cosmiccam = ["py.typed"]
