[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicdms"
version = "0.1.0"
description = "Python API for the CosmicDMS CAM application"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["cosmicdms"]

[tool.setuptools.package-data]
cosmicdms = ["py.typed"]
